name: adopt-sync
on:
  schedule:
    # 한국시간 오전 10시(UTC 01:00). 전에는 '30 20 * * *' 로 한국시간 05:30 이었다.
    #
    # ★2026-08-13 — 처음엔 "새벽 점검 시간대라 실패한다"고 적었다가 바로 지웠다.
    #   실행 이력을 화면으로 확인하니 근거가 없었다.
    #     실패  8/07 09:56 · 8/12 06:12 · 8/13 06:11
    #     성공  8/08 06:07 · 8/09 05:57 · 8/10 06:01 · 8/11 06:09
    #   새벽에 나흘 연속 성공했고, 실패한 8/7 은 오전 10시에 가까운 시각이었다.
    #   **시간대와 실패는 상관이 뚜렷하지 않다. 간헐적인 서버 불안정으로 본다.**
    #
    #   그래도 시각은 옮겨둔다. 낮이 더 낫다는 증거는 없지만,
    #   실패했을 때 사람이 깨어 있는 시간이라 알아채고 손쓸 수 있다.
    #   실제 대책은 이 시각이 아니라 adopt-sync.mjs 의 재시도 강화 쪽이다.
    #
    #   실패해도 커밋을 안 하니 앱은 전날 데이터를 그대로 쓴다 — 데이터가 사라지진 않는다.
    #
    # ★2026-08-14 재조정 — '0 1'(정각)로 뒀더니 두 시간이 지나도 안 돌았다.
    #   깃허브는 예약이 정각과 30분에 몰려서 그 시각을 가장 크게 밀어낸다.
    #   전 cron '30 20' 도 :30 이라 매번 밀렸다 — 실측 지연 27·39·41·72분.
    #   그래서 아무도 안 쓰는 분으로 옮긴다. 붐비지 않는 자리라 덜 밀린다.
    - cron: '13 1 * * *'
    #
    # ★2026-08-20 — 오후 한 번을 더 넣는다 (UTC 07:47 = 한국시간 16:47).
    #
    #   [왜] 8/19·8/20 이틀 연속 실패했다. 8/17 에 응답 대기를 90초로 늘려
    #   8/18 엔 성공했는데 다시 무너졌다. 고치고 며칠 뒤 또 깨지는 게 세 번째다.
    #   대기 시간을 늘리는 건 근본 대책이 아니다.
    #
    #   [무엇을 아는가] 8/20 에 국내 PC 에서 같은 서버에 붙어보니 connect 0.034초였다.
    #   서버는 멀쩡하다. 깃허브 해외 러너에서만 간헐적으로 불안정하다.
    #
    #   [그래서] 근본 대책은 수집을 국내 PC 로 옮기는 것이고, 그건 API 키를 받아야 한다.
    #   그 전까지의 임시 대책이 이것이다 — 한 번 실패해도 같은 날 다시 시도한다.
    #   간헐적 실패라면 두 번 중 한 번은 통과한다.
    #   ★임시방편이지 해결이 아니다. 국내 이전이 되면 이 파일째로 걷어낸다.
    #
    #   실패해도 커밋을 안 하므로, 오전이 성공하고 오후가 실패해도 데이터는 안 망가진다.
    - cron: '47 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ★Node 20 은 GitHub Actions 에서 지원 종료 예고가 떴다(로그에 경고로 나온다).
      #   런너가 이미 24 로 강제 실행하고 있어 맞춰 올린다.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # undici 를 직접 쓴다. Node 내장 fetch 는 connect 타임아웃(기본 10초)을
      # 바꿀 방법을 안 열어준다. 그 10초가 #32·#34 를 죽인 지점이다.
      - run: npm install undici@6 --no-save --no-audit --no-fund

      - run: node scripts/adopt-sync.mjs
        env:
          ANIMAL_API_KEY: ${{ secrets.ANIMAL_API_KEY }}
      # ★2026-08-13 — push 가 rejected 로 실패했다(#33).
      #   원인: 워크플로우가 도는 중에 사람이 같은 브랜치에 푸시했다.
      #   봇은 체크아웃 시점의 커밋을 들고 있어서 원격이 앞서가면 밀린다.
      #   데이터는 멀쩡히 받아왔는데 마지막 한 줄에서 통째로 버려졌다.
      #   → 밀리면 원격을 당겨와 얹고 다시 민다. 세 번까지 시도한다.
      #     adopt/ 아래 파일만 건드리므로 rebase 로 꼬일 일이 없다.
      - run: |
          git config user.name "adopt-bot"
          git config user.email "bot@users.noreply.github.com"
          git add adopt/
          if git diff --cached --quiet; then
            echo "바뀐 데이터 없음 — 커밋하지 않는다"
            exit 0
          fi
          git commit -m "adopt data $(date +%F)"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "푸시 완료 (시도 $i)"
              exit 0
            fi
            echo "푸시 실패 — 원격이 앞서갔다. 5초 뒤 다시 시도 ($i/3)"
            sleep 5
          done
          echo "세 번 다 실패했다"
          exit 1
