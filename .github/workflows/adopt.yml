name: adopt-sync
on:
  # ★2026-09-19 — 예약을 걷어냈다. 대표님: "이거 왜자꾸실패햇다고 뜨지? 근본적인해결책 찾아서 해결해"
  #
  # [무엇이 사실이었나] 최근 14회 중 ★3회 실패(9/13 15:06 · 9/18 14:52 · 9/19 21:04).
  #   하루 두 번 중 한 번만 성공해도 데이터는 최신이라 ★데이터가 상한 적은 없다.
  #   즉 실패 알림은 피해가 아니라 ★소음이었다. 그런데 소음이 매일 오면 진짜 경보를 못 알아본다.
  #
  # [왜 실패하나] 코드 문제가 아니라 ★실행 위치 문제다. 8월에 네 번 고쳤고 전부 임시방편이었다
  #   (재시도 8회 → connect 60초 → 응답 90초 → 하루 2회 증편).
  #   깃허브 해외 러너에서 apis.data.go.kr 로 붙는 것이 간헐적으로 끊긴다.
  #   같은 시각 국내 PC 에서는 0.13초에 붙는다(2026-09-07 실측 3전 3승).
  #
  # [그래서 진짜 대책] 수집을 국내 PC 로 옮기는 것. ★그건 2026-09-07 에 이미 해 뒀다 —
  #   작업 스케줄러 '유기견_데이터_수집' 이 하루 두 번(10:20 · 17:20) 돈다.
  #   ★그런데 그 작업이 9/11 에 꺼져 있었다. 깃허브가 대신 떠받치고 있어서 아무도 몰랐다.
  #   9/19 21:20 에 다시 켰고, 손으로 돌려 4,716마리 수집·푸시까지 확인했다.
  #
  # [안전망] 데이터가 26시간 넘게 안 바뀌면 세션_브리지\_adopt결과확인.py 가 텔레그램으로 알린다.
  #   깃허브를 껐으므로 이제 이것이 ★유일한 안전망이다. 이 확인기를 지우지 말 것.
  #
  # 필요하면 Actions 탭에서 손으로 돌릴 수 있다(workflow_dispatch 는 남겨 둔다).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ★Node 20 은 GitHub Actions 에서 지원 종료 예고가 떴다(로그에 경고로 나온다).
      #   런너가 이미 24 로 강제 실행하고 있어 맞춰 올린다.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # undici 를 직접 쓴다. Node 내장 fetch 는 connect 타임아웃(기본 10초)을
      # 바꿀 방법을 안 열어준다. 그 10초가 #32·#34 를 죽인 지점이다.
      - run: npm install undici@6 --no-save --no-audit --no-fund

      - run: node scripts/adopt-sync.mjs
        env:
          ANIMAL_API_KEY: ${{ secrets.ANIMAL_API_KEY }}
      # ★2026-08-13 — push 가 rejected 로 실패했다(#33).
      #   원인: 워크플로우가 도는 중에 사람이 같은 브랜치에 푸시했다.
      #   봇은 체크아웃 시점의 커밋을 들고 있어서 원격이 앞서가면 밀린다.
      #   데이터는 멀쩡히 받아왔는데 마지막 한 줄에서 통째로 버려졌다.
      #   → 밀리면 원격을 당겨와 얹고 다시 민다. 세 번까지 시도한다.
      #     adopt/ 아래 파일만 건드리므로 rebase 로 꼬일 일이 없다.
      - run: |
          git config user.name "adopt-bot"
          git config user.email "bot@users.noreply.github.com"
          git add adopt/
          if git diff --cached --quiet; then
            echo "바뀐 데이터 없음 — 커밋하지 않는다"
            exit 0
          fi
          git commit -m "adopt data $(date +%F)"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "푸시 완료 (시도 $i)"
              exit 0
            fi
            echo "푸시 실패 — 원격이 앞서갔다. 5초 뒤 다시 시도 ($i/3)"
            sleep 5
          done
          echo "세 번 다 실패했다"
          exit 1
