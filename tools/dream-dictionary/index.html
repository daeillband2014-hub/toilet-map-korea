<p>꿈에서 본 것을 검색창에 넣으면 전해 내려오는 해석을 보여드립니다. 돼지, 이빨, 물, 뱀처럼 자주 나오는 소재를 담았습니다.</p>
<p>민간에 전해지는 풀이를 모은 것이며 재미로 보는 콘텐츠입니다.</p>
