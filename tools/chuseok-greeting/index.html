<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>추석 인사말</title>
<style>
:root{--p:#8C5A2B;--pd:#5E3A18;--acc:#C0392B;--ink:#191F28;--sub:#4E5968;--mut:#8B95A1;
--bg:#FBF6EE;--lt:#EADFCB;--paper:#FFFDF8;--moon:#F5C74C;--safe-b:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;color:var(--ink);
background:var(--bg);min-height:100dvh;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column;max-width:480px;width:100%;margin:0 auto;
padding:calc(env(safe-area-inset-top,0px) + 76px) 20px calc(var(--safe-b) + 28px)}
h1{font-size:23px;line-height:1.35;margin-bottom:8px;text-align:center}
.desc{font-size:14px;color:var(--sub);line-height:1.6;margin-bottom:16px;text-align:center}
.emoji{font-size:52px;margin-bottom:6px;text-align:center;line-height:1}

/* 디데이 카드 — 홈에서 가장 먼저 보이는 것. 매일 다시 들어올 이유가 된다. */
.dday{background:linear-gradient(160deg,#2B3566,#1A2145);border-radius:20px;padding:24px 20px 20px;
text-align:center;margin-bottom:14px;box-shadow:0 6px 22px rgba(26,33,69,.28);position:relative;overflow:hidden}
.dday .moon{position:absolute;top:-26px;right:-18px;width:104px;height:104px;border-radius:50%;
background:radial-gradient(circle at 38% 34%,#FFE9A8,var(--moon));opacity:.92}
.dday .lbl{font-size:12.5px;color:#B9C4E8;letter-spacing:1px;position:relative}
.dday .num{font-size:44px;font-weight:800;color:#fff;line-height:1.12;margin:2px 0 3px;position:relative}
.dday .sub{font-size:13px;color:#C6D0EF;position:relative}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
button.pick{padding:17px 8px;border:1.5px solid var(--lt);border-radius:15px;background:var(--paper);
color:var(--pd);font-size:15px;font-weight:700;cursor:pointer;line-height:1.45;font-family:inherit}
button.pick:active{transform:scale(.98)}
button.pick .ic{display:block;font-size:25px;margin-bottom:5px}
button.pick .hint{display:block;font-size:11.5px;color:var(--mut);font-weight:500;margin-top:3px}

button.big{width:100%;padding:16px 0;border:none;border-radius:14px;background:var(--p);
color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin-top:6px;font-family:inherit}
button.big:active{transform:scale(.98)}
button.ghost{width:100%;padding:14px 0;border:1.5px solid var(--p);border-radius:14px;
background:var(--paper);color:var(--pd);font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;font-family:inherit}

/* 광고가 뜨기 전에 미리 알리는 문구. 이게 없어 반려된 적이 있다(오늘의 운세, 8/24). */
.adnote{font-size:12px;color:var(--sub);text-align:center;margin:10px 0 2px;line-height:1.5}

.msg{background:var(--paper);border-radius:16px;padding:18px 18px 14px;margin-bottom:11px;
box-shadow:0 2px 10px rgba(140,90,43,.10);border-left:4px solid var(--moon)}
.msg .len{font-size:11.5px;color:var(--mut);margin-bottom:7px;letter-spacing:.3px}
.msg .txt{font-size:15px;line-height:1.75;color:var(--ink);white-space:pre-wrap;word-break:keep-all}
.msg .cp{margin-top:11px;width:100%;padding:11px 0;border:1.5px solid var(--lt);border-radius:11px;
background:#fff;color:var(--pd);font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
.msg .cp:active{background:var(--bg)}
.msg .cp.done{background:var(--p);color:#fff;border-color:var(--p)}

.sect{background:var(--paper);border-radius:15px;padding:16px 18px;margin-bottom:12px;
box-shadow:0 2px 10px rgba(140,90,43,.09);font-size:13.5px;color:var(--sub);line-height:1.8;text-align:left}
.sect b{color:var(--pd);display:block;margin-bottom:5px;font-size:14px}
.note{background:var(--paper);border-radius:15px;padding:15px 17px;font-size:13px;
color:var(--sub);line-height:1.75;margin-bottom:12px;text-align:left}
.note b{color:var(--pd)}
.who{font-size:16px;font-weight:800;color:var(--pd);margin:2px 0 12px;text-align:center}
.bannerbox{margin:14px 0 4px;min-height:0}
.foot{font-size:12px;color:var(--mut);text-align:center;line-height:1.6;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 26px);transform:translateX(-50%);
background:rgba(25,31,40,.93);color:#fff;font-size:13.5px;padding:11px 20px;border-radius:22px;
opacity:0;transition:opacity .18s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
</style>

<h2>추석 인사말</h2>
<p>명절마다 인사말이 떠오르지 않아 검색합니다. 보낼 상대를 고르면 그에 맞는 문구가 나오고 그대로 복사해서 쓸 수 있습니다.</p>
<p>거래처용은 격식을 갖춘 문장, 친구용은 편한 말투로 나눠 두었습니다.</p>

</section>
