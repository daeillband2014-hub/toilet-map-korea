<style>
:root{--p:#E94057;--pd:#C22B44;--p2:#7852DC;--ink:#191F28;--sub:#4E5968;--mut:#8B95A1;
--bg:#FDF4F6;--lt:#F7D6DD;--safe-b:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;color:var(--ink);
background:var(--bg);min-height:100dvh;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column;max-width:480px;width:100%;margin:0 auto;
padding:calc(env(safe-area-inset-top,0px) + 76px) 20px calc(var(--safe-b) + 28px)}
h1{font-size:24px;line-height:1.35;margin-bottom:8px;text-align:center}
.desc{font-size:14px;color:var(--sub);line-height:1.6;margin-bottom:16px;text-align:center}
.emoji{font-size:54px;margin-bottom:8px;text-align:center}
.topics{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.topic{background:#fff;border-radius:16px;padding:17px 18px;display:flex;align-items:center;
gap:13px;box-shadow:0 3px 13px rgba(233,64,87,.09);cursor:pointer;border:1.5px solid transparent}
.topic:active{transform:scale(.98)}
.topic .ti{font-size:30px}
.topic .tn{font-size:16px;font-weight:700}
.topic .td{font-size:12.5px;color:var(--mut);margin-top:2px}
.round{font-size:14px;font-weight:800;color:var(--p);text-align:center;margin-bottom:4px}
.prog{font-size:12px;color:var(--mut);text-align:center;margin-bottom:14px}
.vswrap{display:flex;flex-direction:column;gap:12px;position:relative}
.pick{background:#fff;border-radius:18px;padding:26px 18px;text-align:center;cursor:pointer;
box-shadow:0 4px 16px rgba(233,64,87,.1);border:2px solid transparent}
.pick:active{transform:scale(.97);border-color:var(--p)}
.pick .pi{font-size:44px;margin-bottom:8px}
.pick .pn{font-size:18px;font-weight:800;line-height:1.4}
.pick .pd{font-size:13px;color:var(--sub);margin-top:5px;line-height:1.55}
.vsball{align-self:center;width:44px;height:44px;border-radius:50%;background:var(--ink);
color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;
font-size:15px;margin:-4px 0}
button.big{width:100%;padding:16px 0;border:none;border-radius:14px;background:var(--p);
color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin-top:6px}
button.big:active{transform:scale(.98)}
button.ghost{width:100%;padding:14px 0;border:1.5px solid var(--p);border-radius:14px;
background:#fff;color:var(--pd);font-size:15px;font-weight:700;cursor:pointer;margin-top:10px}
/* 광고가 뜨기 전에 미리 알리는 문구. 운세 앱이 이게 없어 반려됐다(2026-08-24). 처음부터 넣는다. */
.adnote{font-size:12px;color:var(--sub);text-align:center;margin:10px 0 2px;line-height:1.5}
.wincard{background:linear-gradient(135deg,var(--p),var(--p2));border-radius:22px;
padding:34px 22px;text-align:center;color:#fff;margin-bottom:13px;
box-shadow:0 6px 24px rgba(233,64,87,.3)}
.wincard .crown{font-size:44px}
.wincard .wt{font-size:13px;opacity:.85;margin-top:6px;letter-spacing:2px}
.wincard .wi{font-size:56px;margin:10px 0 6px}
.wincard .wn{font-size:24px;font-weight:800;line-height:1.35}
.wincard .wd{font-size:13.5px;opacity:.92;margin-top:8px;line-height:1.6}
.runner{background:#fff;border-radius:14px;padding:14px 17px;display:flex;align-items:center;
gap:11px;box-shadow:0 2px 10px rgba(233,64,87,.08);margin-bottom:12px;font-size:14.5px}
.runner b{font-weight:800}
.runner .rl{font-size:12px;color:var(--mut);margin-left:auto}
.note{background:#fff;border-radius:15px;padding:15px 17px;font-size:13px;
color:var(--sub);line-height:1.75;margin-bottom:12px;text-align:left}
.note b{color:var(--pd)}
.bannerbox{margin:14px 0 4px;min-height:0}
.foot{font-size:12px;color:var(--mut);text-align:center;line-height:1.6;margin-top:10px}
</style>
