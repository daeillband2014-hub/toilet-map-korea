<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>부가세 계산기</title>
<style>
:root{--p:#46509F;--pd:#333B78;--acc:#E63C46;--ink:#191F28;--sub:#4E5968;--mut:#8B95A1;
--bg:#F2F7FD;--lt:#CFE2F7;--safe-b:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;color:var(--ink);
background:var(--bg);min-height:100dvh;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column;max-width:480px;width:100%;margin:0 auto;
padding:calc(env(safe-area-inset-top,0px) + 76px) 20px calc(var(--safe-b) + 28px)}
h1{font-size:24px;line-height:1.35;margin-bottom:8px;text-align:center}
.desc{font-size:14px;color:var(--sub);line-height:1.6;margin-bottom:16px;text-align:center}
.emoji{font-size:54px;margin-bottom:8px;text-align:center}
.seg{display:flex;background:#fff;border:1.5px solid var(--lt);border-radius:13px;overflow:hidden;margin-bottom:16px}
.seg button{flex:1;padding:12px 0;border:none;background:transparent;font-size:13.5px;
font-weight:700;color:var(--mut);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--p);color:#fff}
label{display:block;font-size:13px;color:var(--sub);font-weight:600;margin:12px 0 7px}
input[type=date],input[type=number]{width:100%;padding:14px;border:1.5px solid var(--lt);
border-radius:13px;font-size:16px;background:#fff;color:var(--ink);font-family:inherit}
button.big{width:100%;padding:16px 0;border:none;border-radius:14px;background:var(--p);
color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin-top:6px}
button.big:active{transform:scale(.98)}
button.ghost{width:100%;padding:14px 0;border:1.5px solid var(--p);border-radius:14px;
background:#fff;color:var(--pd);font-size:15px;font-weight:700;cursor:pointer;margin-top:10px}
/* 광고가 뜨기 전에 미리 알리는 문구. 운세 앱이 이게 없어 반려됐다(2026-08-24). 처음부터 넣는다. */
.adnote{font-size:12px;color:var(--sub);text-align:center;margin:10px 0 2px;line-height:1.5}
.rcard{background:#fff;border-radius:20px;padding:28px 20px;text-align:center;
box-shadow:0 5px 20px rgba(14,90,180,.12);margin-bottom:13px}
.rbig{font-size:52px;font-weight:800;color:var(--acc);line-height:1.15;letter-spacing:-1px}
.rlabel{font-size:14px;color:var(--mut);margin-top:8px;line-height:1.6}
.rsub{font-size:15px;font-weight:700;color:var(--p);margin-top:4px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:15px;overflow:hidden;
box-shadow:0 2px 12px rgba(14,90,180,.08);font-size:13.5px;margin-bottom:12px}
th{background:var(--lt);color:var(--pd);font-size:12.5px;padding:10px 8px;font-weight:700}
td{padding:10px 8px;text-align:center;border-top:1px solid #E7F0FA;color:var(--sub)}
td b{color:var(--ink)}
.note{background:#fff;border-radius:15px;padding:15px 17px;font-size:13px;
color:var(--sub);line-height:1.75;margin-bottom:12px;text-align:left}
.note b{color:var(--pd)}
.bannerbox{margin:14px 0 4px;min-height:0}
.foot{font-size:12px;color:var(--mut);text-align:center;line-height:1.6;margin-top:10px}
</style>
  <script type="module" crossorigin src="./assets/index-DMbMyBzp.js"></script>

.webhdr a{color:#191F28;text-decoration:none;font-weight:800;font-size:15px}
.webhdr a.all{font-weight:600;color:#4E5968;font-size:13px}
.webftr{max-width:480px;margin:24px auto 0;padding:16px 20px 32px;font-size:12px;color:#8B95A1;line-height:1.7;text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif}
.webftr a{color:#4E5968}
#webad{max-width:480px;margin:8px auto 0;padding:0 20px;min-height:0}
.adnote{display:none!important}
</style>
