<style>
:root{--p:#0A7A57;--pd:#075C41;--acc:#FFB703;--ink:#191F28;--sub:#4E5968;--mut:#8B95A1;
--bg:#F2FBF7;--lt:#C8EBDD;--safe-b:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;color:var(--ink);
background:var(--bg);min-height:100dvh;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column;max-width:480px;width:100%;margin:0 auto;
padding:calc(env(safe-area-inset-top,0px) + 76px) 20px calc(var(--safe-b) + 28px)}
h1{font-size:24px;line-height:1.35;margin-bottom:8px;text-align:center}
.desc{font-size:14px;color:var(--sub);line-height:1.6;margin-bottom:16px;text-align:center}
.emoji{font-size:56px;margin-bottom:8px;text-align:center}
label{display:block;font-size:13px;color:var(--sub);font-weight:600;margin:12px 0 7px}
select,input[type=text]{width:100%;padding:14px;border:1.5px solid var(--lt);border-radius:13px;
font-size:16px;background:#fff;color:var(--ink);font-family:inherit}
.names{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;gap:8px;align-items:center}
.pn{width:34px;height:34px;border-radius:50%;background:var(--lt);color:var(--pd);
display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
button.big{width:100%;padding:16px 0;border:none;border-radius:14px;background:var(--p);
color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin-top:6px}
button.big:active{transform:scale(.98)}
button.ghost{width:100%;padding:14px 0;border:1.5px solid var(--p);border-radius:14px;
background:#fff;color:var(--pd);font-size:15px;font-weight:700;cursor:pointer;margin-top:10px}
.seg{display:flex;background:#fff;border:1.5px solid var(--lt);border-radius:13px;overflow:hidden;margin-bottom:4px}
.seg button{flex:1;padding:12px 0;border:none;background:transparent;font-size:14.5px;
font-weight:700;color:var(--mut);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--p);color:#fff}
/* 광고가 뜨기 전에 미리 알리는 문구. 운세 앱이 이게 없어 반려됐다(2026-08-24). 처음부터 넣는다. */
.adnote{font-size:12px;color:var(--sub);text-align:center;margin:10px 0 2px;line-height:1.5}
.board{background:#fff;border-radius:18px;padding:16px 12px 12px;margin-bottom:12px;
box-shadow:0 3px 14px rgba(10,122,87,.1)}
canvas{width:100%;display:block}
.rlist{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.rrow{background:#fff;border-radius:13px;padding:13px 16px;display:flex;
justify-content:space-between;align-items:center;box-shadow:0 2px 9px rgba(10,122,87,.07);
font-size:15px;font-weight:700}
.rrow .win{color:var(--p)}
.rrow .lose{color:var(--mut);font-weight:500}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}
.card{aspect-ratio:3/4;border-radius:13px;background:linear-gradient(135deg,var(--p),var(--pd));
display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;
cursor:pointer;box-shadow:0 2px 9px rgba(10,122,87,.18);font-weight:800}
.card.open{background:#fff;color:var(--ink);border:1.5px solid var(--lt);font-size:13px;
flex-direction:column;gap:4px;padding:4px;text-align:center}
.card.open.win{border-color:var(--acc);background:#FFFBEB}
.note{background:#fff;border-radius:15px;padding:15px 17px;font-size:13px;
color:var(--sub);line-height:1.75;margin-bottom:12px;text-align:left}
.note b{color:var(--pd)}
.bannerbox{margin:14px 0 4px;min-height:0}
.foot{font-size:12px;color:var(--mut);text-align:center;line-height:1.6;margin-top:10px}
</style>
