<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>소원 촛불</title>
<style>
:root{--ink:#EDE4D6;--sub:#8A8070;--mut:#5A5348;--line:#241F2C;
--safe-b:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
color:var(--ink);background:#0A0910;overflow-x:hidden}

/* 토스 내비게이션 바는 화면 위에 떠 있다. 자리를 비우지 않으면 우리 내용이
   그 띠 안으로 올라가 '자체 헤더'로 오해받아 반려된다. (2026-08-07) */
#app{min-height:100%;max-width:480px;margin:0 auto;
padding:calc(env(safe-area-inset-top,0px) + 76px) 22px calc(28px + var(--safe-b));
display:flex;flex-direction:column;align-items:center}

/* ───── 촛불 주변 조명 ───── */
#glow{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);
width:760px;height:760px;border-radius:50%;pointer-events:none;z-index:0;
background:radial-gradient(circle,
  rgba(255,176,80,.20) 0%, rgba(255,140,50,.10) 28%,
  rgba(120,70,20,.045) 50%, rgba(0,0,0,0) 70%);
opacity:0;transition:opacity 1.6s ease-out}
body.lit #glow{opacity:1;animation:breathe 4.5s ease-in-out infinite 1.6s}
@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1)}
                   50%{transform:translate(-50%,-50%) scale(1.06)}}

.wrap{position:relative;z-index:1;width:100%;display:flex;
flex-direction:column;align-items:center}

/* ───── 초 ───── */
.holder{position:relative;display:flex;flex-direction:column;align-items:center;
margin-top:26px;margin-bottom:8px}
.candle{position:relative;width:62px;height:158px;border-radius:6px 6px 4px 4px;
background:linear-gradient(100deg,#4A4149 0%,#8C8189 16%,#E8DED2 42%,#F6EFE4 55%,#CFC3B4 78%,#5B5158 100%)}
.candle::before{content:'';position:absolute;top:-7px;left:0;width:62px;height:15px;
border-radius:50%;background:linear-gradient(180deg,#EFE6D8,#C9BDAE)}
.candle::after{content:'';position:absolute;top:6px;left:11px;width:15px;height:52px;
border-radius:0 0 9px 9px;background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0))}
.wick{position:absolute;top:-14px;left:50%;transform:translateX(-50%);
width:3px;height:15px;border-radius:2px;z-index:2;
background:linear-gradient(180deg,#241C16 0%,#3A2E24 60%,#5C4A3A 100%)}

/* 불꽃은 심지 끝에 붙인다. 떠 있으면 촛불이 아니라 불덩이로 보인다. */
.flame{position:absolute;bottom:calc(100% - 6px);left:50%;transform:translateX(-50%);
width:38px;height:74px;opacity:0;transition:opacity .45s ease-out;z-index:1}
body.lit .flame{opacity:1}
.f-outer{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:38px;height:74px;
border-radius:50% 50% 48% 48% / 68% 68% 32% 32%;filter:blur(1.5px);transform-origin:50% 100%;
background:radial-gradient(ellipse at 50% 82%,
  rgba(255,236,180,.95) 0%, rgba(255,190,90,.85) 34%, rgba(255,130,40,.62) 62%,
  rgba(220,80,20,.16) 84%, rgba(180,60,10,0) 100%);
animation:sway 2.1s ease-in-out infinite, flick 3.7s ease-in-out infinite}
.f-inner{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);width:17px;height:38px;
border-radius:50% 50% 46% 46% / 66% 66% 34% 34%;filter:blur(.6px);transform-origin:50% 100%;
background:radial-gradient(ellipse at 50% 78%,#FFFDF4 0%,#FFF0BE 30%,#FFC862 62%,rgba(255,170,60,.35) 100%);
animation:sway2 1.55s ease-in-out infinite}
.f-base{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);width:11px;height:13px;
border-radius:50%;filter:blur(1.2px);
background:radial-gradient(ellipse at 50% 60%,rgba(120,170,255,.55),rgba(90,140,255,0) 72%);
animation:sway2 1.55s ease-in-out infinite}
@keyframes sway{
  0%,100%{transform:translateX(-50%) rotate(-1.6deg) scaleY(1) scaleX(1)}
  22%{transform:translateX(-51%) rotate(1.9deg) scaleY(1.07) scaleX(.95)}
  47%{transform:translateX(-49%) rotate(-1.1deg) scaleY(.95) scaleX(1.05)}
  71%{transform:translateX(-50.5%) rotate(2.4deg) scaleY(1.04) scaleX(.97)}}
@keyframes sway2{
  0%,100%{transform:translateX(-50%) rotate(1.2deg) scaleY(1)}
  35%{transform:translateX(-49%) rotate(-1.7deg) scaleY(1.1)}
  68%{transform:translateX(-51%) rotate(1deg) scaleY(.93)}}
@keyframes flick{0%,86%,100%{opacity:1}90%{opacity:.72}93%{opacity:1}96%{opacity:.85}}

/* 소원이 연기처럼 올라가는 것 */
.rise{position:absolute;left:50%;bottom:190px;transform:translateX(-50%);
font-size:14px;color:#E8DFCB;white-space:nowrap;max-width:88vw;overflow:hidden;
text-overflow:ellipsis;opacity:0;pointer-events:none}
.rise.go{animation:rise 3.4s ease-out forwards}
@keyframes rise{
  0%{opacity:0;transform:translate(-50%,10px) scale(.96)}
  18%{opacity:.95}
  100%{opacity:0;transform:translate(-50%,-150px) scale(1.04)}}

/* ───── 글자 · 버튼 ───── */
.t1{font-size:19px;font-weight:700;letter-spacing:-.4px;text-align:center;margin-top:34px}
.t2{font-size:14px;color:var(--sub);margin-top:9px;line-height:1.65;text-align:center}
.cnt{font-size:12.5px;color:var(--mut);margin-top:18px;text-align:center;line-height:1.6}
.big{width:100%;margin-top:26px;padding:16px 0;border:none;border-radius:14px;
background:#F0A93C;color:#2A1B00;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}
.ghost{width:100%;margin-top:11px;padding:14px 0;border:1px solid #3A3348;border-radius:14px;
background:transparent;color:#B7AC9A;font-size:15px;font-family:inherit;cursor:pointer}
textarea{width:100%;margin-top:20px;background:#12101A;border:1px solid #2E2839;
border-radius:12px;padding:14px;font-size:15px;font-family:inherit;color:var(--ink);
resize:none;min-height:58px;line-height:1.6}
textarea::placeholder{color:#4E4759}
.foot{font-size:12px;color:var(--mut);margin-top:16px;text-align:center;line-height:1.7}

.wishcard{width:100%;background:#12101A;border:1px solid var(--line);border-radius:14px;
padding:14px 16px;margin-bottom:9px}
.wd{font-size:12px;color:var(--mut);margin-bottom:5px}
.wt{font-size:15px;color:#DFD5C4;line-height:1.6;word-break:break-all}
.empty{color:var(--mut);font-size:14px;text-align:center;padding:36px 0;line-height:1.8}
h1{font-size:19px;letter-spacing:-.3px;align-self:flex-start}
#adslot{width:100%;min-height:0;margin-top:16px}
</style>
