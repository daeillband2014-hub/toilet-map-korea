body{font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;color:var(--ink);
background:var(--bg);min-height:100dvh;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column;max-width:480px;width:100%;margin:0 auto;

button.big{width:100%;padding:16px 0;border:none;border-radius:14px;background:var(--p);
color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin-top:4px}
button.big:active{transform:scale(.98)}
button.ghost{width:100%;padding:14px 0;border:1.5px solid var(--p);border-radius:14px;
background:#fff;color:var(--pd);font-size:15px;font-weight:700;cursor:pointer;margin-top:10px}
.rcard{background:#fff;border-radius:20px;padding:24px 22px;text-align:center;
box-shadow:0 4px 20px rgba(194,65,12,.13);margin-bottom:14px}
.mon{font-size:15px;color:var(--mut);margin-bottom:4px}
.cnt{font-size:46px;font-weight:800;color:var(--p);line-height:1.15}
.cntl{font-size:13px;color:var(--mut);margin-top:4px}
.dlist{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}

.dcard.sat{background:#FFFBEB}
.dl{text-align:left}
.dd{font-size:17px;font-weight:700}
.dsub{font-size:12.5px;color:var(--mut);margin-top:3px}
.tag{font-size:11.5px;background:var(--tagbg);color:var(--tagtx);

.chk{background:#fff;border-radius:18px;padding:20px 18px;margin-bottom:14px;
box-shadow:0 3px 14px rgba(194,65,12,.09)}
.chkr{text-align:center;font-size:19px;font-weight:800;margin-top:12px;line-height:1.5}
.chkr.ok{color:var(--p)} .chkr.no{color:var(--sub)}
.note{background:#fff;border-radius:15px;padding:16px 17px;font-size:13px;

.note b{color:var(--pd)}
.bannerbox{margin:14px 0 4px;min-height:0}
.foot{font-size:12px;color:var(--mut);text-align:center;line-height:1.6;margin-top:10px}
