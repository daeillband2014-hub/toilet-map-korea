<title>만나이 계산기</title>
<style>
:root{--p:#4DABF7;--pd:#1C6EBE;--ink:#191F28;--sub:#4E5968;--mut:#8B95A1;--bg:#F4F9FF;
--lt:#D6E9FF;--tagbg:#EAF4FF;--tagtx:#1C6EBE;--safe-b:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;color:var(--ink);
background:var(--bg);min-height:100dvh;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column;max-width:480px;width:100%;margin:0 auto;
padding:calc(env(safe-area-inset-top,0px) + 76px) 20px 0}
h1{font-size:24px;line-height:1.35;margin-bottom:8px;text-align:center}
.desc{font-size:14px;color:var(--sub);line-height:1.6;margin-bottom:22px;text-align:center}
.emoji{font-size:60px;margin-bottom:12px;text-align:center}
label{display:block;font-size:13px;color:var(--sub);font-weight:600;margin-bottom:7px}
input[type=date]{width:100%;padding:15px;border:1.5px solid var(--lt);border-radius:13px;
font-size:16px;background:#fff;color:var(--ink);font-family:inherit;margin-bottom:12px}
button.big{width:100%;padding:16px 0;border:none;border-radius:14px;background:var(--p);
color:#fff;font-size:17px;font-weight:700;cursor:pointer}
button.big:active{transform:scale(.98)}
button.ghost{width:100%;padding:14px 0;border:1.5px solid var(--p);border-radius:14px;
background:#fff;color:var(--pd);font-size:15px;font-weight:700;cursor:pointer;margin-top:10px}
.rcard{background:#fff;border-radius:20px;padding:24px 22px;text-align:center;
box-shadow:0 4px 20px rgba(77,171,247,.14);margin-bottom:12px}
.big-num{font-size:52px;font-weight:800;color:var(--p);line-height:1.1}
.big-lbl{font-size:13px;color:var(--mut);margin-top:4px}
.sub-row{display:flex;gap:10px;margin-top:16px}
.sbox{flex:1;background:var(--tagbg);border-radius:13px;padding:12px 8px}
.sbox .v{font-size:19px;font-weight:800;color:var(--pd)}
.sbox .l{font-size:11.5px;color:var(--mut);margin-top:3px}
.list{background:#fff;border-radius:16px;padding:6px 16px;margin-bottom:12px;
box-shadow:0 2px 10px rgba(77,171,247,.07)}
.item{display:flex;justify-content:space-between;align-items:center;padding:13px 0;
border-bottom:1px solid #EDF3FA;font-size:14px}
.item:last-child{border-bottom:none}
.item .k{color:var(--sub)}
.item .v{font-weight:700}
.item .d{font-size:11.5px;color:var(--p);font-weight:700}
.sect{font-size:13px;font-weight:700;color:var(--mut);margin:16px 0 8px 2px}
#adslot{width:100%;height:calc(96px + var(--safe-b));padding-bottom:var(--safe-b);margin-top:14px}
.foot{font-size:11px;color:var(--mut);text-align:center;margin-top:12px;line-height:1.5;
padding-bottom:calc(8px + var(--safe-b))}
</style>
