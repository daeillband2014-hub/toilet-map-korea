<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 사자성어</title>
<style>
:root{--p:#4A3626;--pd:#33251A;--acc:#B4392E;--ink:#191F28;--sub:#4E5968;--mut:#8B95A1;
--bg:#F8F5EF;--lt:#E6DCC9;--paper:#FFFDF7;--safe-b:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;color:var(--ink);
background:var(--bg);min-height:100dvh;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column;max-width:480px;width:100%;margin:0 auto;
padding:calc(env(safe-area-inset-top,0px) + 76px) 20px calc(var(--safe-b) + 28px)}
h1{font-size:24px;line-height:1.35;margin-bottom:8px;text-align:center}
.desc{font-size:14px;color:var(--sub);line-height:1.6;margin-bottom:16px;text-align:center}
.emoji{font-size:54px;margin-bottom:8px;text-align:center}
button.big{width:100%;padding:16px 0;border:none;border-radius:14px;background:var(--p);
color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin-top:6px}
button.big:active{transform:scale(.98)}
button.ghost{width:100%;padding:14px 0;border:1.5px solid var(--p);border-radius:14px;
background:var(--paper);color:var(--pd);font-size:15px;font-weight:700;cursor:pointer;margin-top:10px}
/* 광고가 뜨기 전에 미리 알리는 문구. 운세 앱이 이게 없어 반려됐다(2026-08-24). 처음부터 넣는다. */
.adnote{font-size:12px;color:var(--sub);text-align:center;margin:10px 0 2px;line-height:1.5}
.scroll{background:var(--paper);border-radius:20px;padding:30px 22px 26px;text-align:center;
box-shadow:0 5px 20px rgba(74,54,38,.14);margin-bottom:13px;
border-top:8px solid var(--p);border-bottom:8px solid var(--p)}
.scroll .date{font-size:12.5px;color:var(--mut);letter-spacing:1px}
.scroll .word{font-size:40px;font-weight:800;letter-spacing:6px;margin:10px 0 2px;color:var(--pd)}
.scroll .hanja{font-size:22px;color:var(--acc);letter-spacing:8px;margin-bottom:10px}
.scroll .mean{font-size:15.5px;font-weight:700;line-height:1.6}
.sect{background:var(--paper);border-radius:15px;padding:16px 18px;margin-bottom:12px;
box-shadow:0 2px 10px rgba(74,54,38,.09);font-size:13.5px;color:var(--sub);line-height:1.8;text-align:left}
.sect b{color:var(--pd);display:block;margin-bottom:5px;font-size:14px}
.note{background:var(--paper);border-radius:15px;padding:15px 17px;font-size:13px;
color:var(--sub);line-height:1.75;margin-bottom:12px;text-align:left}
.note b{color:var(--pd)}
.bannerbox{margin:14px 0 4px;min-height:0}
.foot{font-size:12px;color:var(--mut);text-align:center;line-height:1.6;margin-top:10px}
</style>
