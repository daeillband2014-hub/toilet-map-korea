<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 타로</title>
<style>
:root{--p:#5B3FA6;--pd:#3E2B75;--gold:#D9A93C;--ink:#191F28;--sub:#4E5968;--mut:#8B95A1;
--bg:#F6F3FB;--lt:#E2DAF2;--paper:#FFFFFF;--night:#2A1F52;--safe-b:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;color:var(--ink);
background:var(--bg);min-height:100dvh;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column;max-width:480px;width:100%;margin:0 auto;
padding:calc(env(safe-area-inset-top,0px) + 76px) 20px calc(var(--safe-b) + 28px)}
h1{font-size:23px;line-height:1.35;margin-bottom:8px;text-align:center}
.desc{font-size:14px;color:var(--sub);line-height:1.6;margin-bottom:16px;text-align:center}
.date{font-size:12.5px;color:var(--mut);text-align:center;letter-spacing:1px;margin-bottom:12px}

/* 카드 뒷면 — 뽑기 전 화면의 주인공 */
.deck{display:flex;justify-content:center;gap:11px;margin:6px 0 18px}
.back{width:88px;height:130px;border-radius:13px;background:linear-gradient(150deg,#4A3590,var(--night));
border:2.5px solid var(--gold);display:flex;align-items:center;justify-content:center;
color:var(--gold);font-size:27px;box-shadow:0 5px 16px rgba(42,31,82,.3)}
.back.tilt1{transform:rotate(-9deg) translateY(6px)}
.back.tilt2{transform:rotate(9deg) translateY(6px)}

/* 뽑은 카드 */
.card{background:linear-gradient(158deg,#40308A,var(--night));border-radius:20px;
padding:26px 22px 22px;text-align:center;margin-bottom:14px;border:2.5px solid var(--gold);
box-shadow:0 7px 24px rgba(42,31,82,.3)}
.card .no{font-size:12.5px;color:#C7B9F0;letter-spacing:2px}
.card .sym{font-size:56px;line-height:1.1;margin:8px 0 4px}
.card .nm{font-size:25px;font-weight:800;color:#fff;margin-bottom:3px}
.card .en{font-size:12.5px;color:#B7A6EA;letter-spacing:1.5px;margin-bottom:11px}
.card .key{display:inline-block;background:rgba(217,169,60,.18);border:1px solid rgba(217,169,60,.5);
color:#F0D89A;font-size:13px;font-weight:700;padding:6px 15px;border-radius:20px}

.sect{background:var(--paper);border-radius:15px;padding:16px 18px;margin-bottom:11px;
box-shadow:0 2px 10px rgba(91,63,166,.09);font-size:13.5px;color:var(--sub);line-height:1.8;text-align:left}
.sect b{color:var(--pd);display:block;margin-bottom:5px;font-size:14px}
.three{display:flex;gap:9px;margin-bottom:12px}
.three .t{flex:1;background:var(--paper);border-radius:14px;padding:13px 9px;text-align:center;
box-shadow:0 2px 9px rgba(91,63,166,.09)}
.three .t .when{font-size:11.5px;color:var(--mut);margin-bottom:5px}
.three .t .s{font-size:29px;line-height:1.15}
.three .t .n{font-size:13px;font-weight:700;color:var(--pd);margin-top:3px;word-break:keep-all}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
button.pick{padding:16px 8px;border:1.5px solid var(--lt);border-radius:15px;background:var(--paper);
color:var(--pd);font-size:15px;font-weight:700;cursor:pointer;line-height:1.45;font-family:inherit}
button.pick:active{transform:scale(.98)}
button.pick .ic{display:block;font-size:24px;margin-bottom:4px}
button.big{width:100%;padding:16px 0;border:none;border-radius:14px;background:var(--p);
color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin-top:6px;font-family:inherit}
button.big:active{transform:scale(.98)}
button.ghost{width:100%;padding:14px 0;border:1.5px solid var(--p);border-radius:14px;
background:var(--paper);color:var(--pd);font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;font-family:inherit}

/* 광고가 뜨기 전에 미리 알리는 문구. 이게 없어 반려된 적이 있다(오늘의 운세, 8/24). */
.adnote{font-size:12px;color:var(--sub);text-align:center;margin:10px 0 2px;line-height:1.5}
.bannerbox{margin:14px 0 4px;min-height:0}
.foot{font-size:12px;color:var(--mut);text-align:center;line-height:1.6;margin-top:10px}
</style>
